# This workflow will build the project on pull requests with tests
# Uses:
#   OS: ubuntu-latest
#   JDK: Adopt JDK 21
#   Maven: 3.9.11 (the image's Maven 3.10.0 cannot load the Tycho based carbon-p2-plugin)

name: PR Builder

on:
  pull_request:
    branches: [4.12.x]
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered for the same PR
concurrency: 
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx4g -Xms1g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Adopt JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: "21"
          distribution: "adopt"
      - name: Set up Maven 3.9.x
        # Maven 3.10.0 (ubuntu-latest image 20261004+) breaks the Tycho based carbon-p2-plugin.
        run: |
          MAVEN_VERSION=3.9.11
          MAVEN_SHA512=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          MAVEN_ARCHIVE="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "$MAVEN_ARCHIVE" https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
          echo "${MAVEN_SHA512}  ${MAVEN_ARCHIVE}" | sha512sum -c -
          tar -xzf "$MAVEN_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" --version
      - name: Cache local Maven repository
        id: cache-maven-m2
        uses: actions/cache@v3
        env:
          cache-name: cache-m2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.cache-name }}-
            ${{ runner.os }}-maven-
            ${{ runner.os }}-
      - name: Build with Maven
        run: mvn clean install -U -B
      - name: Delete SNAPSHOT artifacts
        run: find ~/.m2/repository/ -name "*-SNAPSHOT" -type d -print -prune -exec rm -r {} +
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/target/coverage-reports/site/jacoco-aggregate/jacoco.xml"
          flags: unit
